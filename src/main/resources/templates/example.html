<!doctype html>
<html lang="en" xmlns:th="http://www.w3.org/1999/xhtml">
<head>
    <meta charset="UTF-8">
    <meta name="viewport"
          content="width=device-width, user-scalable=no, initial-scale=1.0, maximum-scale=1.0, minimum-scale=1.0">
    <meta http-equiv="X-UA-Compatible" content="ie=edge">
    <title>Document</title>
</head>
<body>
     <h1>타임리프 익하기</h1>
     <p>학생 정보</p>
     <div>
         <p th:text="${student.name}">펑하오</p>
         <p th:text="${student.age}">99</p>
         <p>대구</p>
         <ul>
             <li th:each="hobby, status : ${student.hobbies}">
                 <span th:text="${hobby}">운동</span>
                 <span th:if="${status.first}">(대표취미)</span>
             </li>
         </ul>
     </div>
</body>
</html>
