<!doctype html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport"
          content="width=device-width, user-scalable=no, initial-scale=1.0, maximum-scale=1.0, minimum-scale=1.0">
    <meta http-equiv="X-UA-Compatible" content="ie=edge">
    <title>Document</title>
</head>
<body>
      <h1>HELLO<span th:text="${name}"></span>Mr.</h1>
      <p>Oh,so you're <span th:text="${age}">years old.</span></p>
      <div>Your hobbies is</div>
      <ul>
          <li th:each="hobby : ${hobbies}">
              <span th:text="${hobby}"></span>
              <span th:if="${hobby == 'Exercise'}">(Representative Hobbies)</span>
          </li>
      </ul>

</body>
</html>
