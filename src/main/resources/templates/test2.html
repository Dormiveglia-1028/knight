<!doctype html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport"
          content="width=device-width, user-scalable=no, initial-scale=1.0, maximum-scale=1.0, minimum-scale=1.0">
    <meta http-equiv="X-UA-Compatible" content="ie=edge">
    <title>Document</title>
</head>
<body>
<p th:text="${today}"></p>
   <div th:object="${student}">
      <h1>Hello Mr. <span th:text="*{name}"></span></h1>
      <p>Oh,so you're <span th:text="*{age}"></span> years old.</p>
      <div>Your hobbies is</div>
      <ul>
          <li th:each="hobby : *{hobbies}">
              <span th:text="${hobby}"></span>
              <span th:if="${hobby == 'Exercise'}">(Representative Hobbies)</span>
              <span th:unless="${hobby == 'Exercise'}">(General Hobbies)</span>
          </li>
      </ul>
   </div>
   <a th:href="@{/api/articles/{id}(id=${blogId})}">
      블로그 <span th:text="${blogId}"></span>번 글 내용보기
   </a>

</body>
</html>
