<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport"
          content="width=device-width, user-scalable=no, initial-scale=1.0, maximum-scale=1.0, minimum-scale=1.0">

<body>
      <h1>Hello Mr. <span th:text="${student.name}"></span></h1>
      <p>Oh,so you're <span th:text="${student.age}"></span> years old.</p>
      <div>Your hobbies is</div>
      <ul>
          <li th:each="hobby : ${student.hobbies}">
              <span th:text="${hobby}"></span>
              <span th:if="${hobby == 'Exercise'}">(Representative Hobbies)</span>
              <span th:unless="${hobby == 'Exercise'}">(General Hobbies)</span>
          </li>
      </ul>
</div>
